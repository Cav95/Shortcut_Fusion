<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Shortcut to Pdm</title>
    <!-- Bootstrap CSS (mobile-first) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root {
            --brand: #0d6efd;
            --brand-dark: #0b5ed7;
            --bg: #ffffff;
            --text: #0b1a2b;
            --accent: #0d6efd;
        }

        /* Visible skip link on focus */
        .skip-link {
            position: absolute;
            left: -999px;
            top: auto;
            width: 1px;
            height: 1px;
            overflow: hidden;
        }

        .skip-link:focus {
            position: static;
            width: auto;
            height: auto;
            padding: .5rem 1rem;
            background: var(--brand);
            color: #fff;
            z-index: 1000;
            border-radius: .25rem;
            margin: .5rem;
            text-decoration: none;
            display: inline-block;
        }

        /* Focus-visible friendly outline */
        :focus-visible {
            outline: 3px solid Highlight;
            outline-offset: 2px;
        }

        body {
            background: var(--bg);
            color: var(--text);
            font-size: 1rem;
            /* mobile-first base */
            line-height: 1.4;
        }

        .brand-heading {
            font-size: 1.25rem;
            font-weight: 600;
        }

        /* Larger touch targets */
        .btn,
        .form-control,
        .form-check-input {
            min-height: 44px;
            padding: .5rem .75rem;
            margin: 5px 0;
        }

        /* Ensure contrast for primary button */
        .btn-primary {
            background-color: var(--brand);
            border-color: var(--brand-dark);
        }
    </style>

    <script>
        document.addEventListener('DOMContentLoaded', function () {
            // Form handling moved to the bottom script to integrate with validation.
        });
    </script>
</head>

<body>
    <a class="skip-link" href="#main-content">Salta al contenuto</a>
    <header class="container-fluid bg-light py-3" role="banner">
        <div class="container d-flex align-items-center">
            <h1 class="brand-heading mb-0">Shortcut to Pdm</h1>
        </div>
    </header>
    <main id="main-content" class="container my-4" role="main">
        <section aria-labelledby="search-form-heading">
            <h2 id="search-form-heading" class="h5">Ricerca PDM</h2>
            <form action="http://192.168.0.242/FUSION/plm.html" method="get" class="needs-validation" novalidate
                aria-describedby="search-desc">
                <p id="search-desc" class="visually-hidden">Compila il codice o seleziona il tipo di ricerca e premi
                    Cerca.</p>
                <div class="mb-3">
                    <label for="opencode" class="form-label">Codice</label>
                    <input type="text" name="opencode" id="opencode" class="form-control" placeholder="Inserisci codice"
                        aria-label="Codice">
                </div>

                <input type="hidden" name="ClientID" id="ClientID" value="8604d71f-eac9-4f70-928a-cb146295152c">
                <input type="hidden" name="locale" id="locale" value="it">
                <input type="hidden" name="IISIDX" id="IISIDX" value="0">
                <input type="hidden" name="contextID" id="contextID" value="hrboomomfa">

                <fieldset class="mb-3">
                    <legend class="col-form-label">Tipo</legend>
                    <div class="form-check">
                        <input class="form-check-input" type="radio" name="AddinCmd" id="CODE" value="Portal">
                        <label class="form-check-label" for="CODE">Anagrafica</label>
                    </div>
                    <div class="form-check">
                        <input class="form-check-input" type="radio" name="AddinCmd" id="BOM" value="PSM">
                        <label class="form-check-label" for="BOM">BOM</label>
                    </div>
                </fieldset>

                <div class="d-grid">
                    <button type="submit" class="btn btn-primary btn-lg" aria-label="Cerca">Cerca</button>
                </div>
            </form>
        </section>
        <div class="row-gap-2"></div>
        <section>
            <div class="d-grid">
                <button type="button" class="btn btn-primary btn-lg"
                    onclick="location.href='http://192.168.0.242/FUSION/plm.html'">Home</button>
            </div>
        </section>
    </main>

    <footer class="container-fluid bg-light py-3 mt-auto" role="contentinfo">
        <div class="container small">&copy; <span id="year">2026</span> Shortcut Fusion</div>
    </footer>

    <!-- Bootstrap JS bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // small enhancement: set current year
        try { document.getElementById('year').textContent = new Date().getFullYear(); } catch (e) { }
        // Basic client-side validation visual feedback + open target page with query args
        (function () {
            'use strict';
            var forms = document.querySelectorAll('.needs-validation');
            Array.prototype.slice.call(forms).forEach(function (form) {
                form.addEventListener('submit', function (event) {
                    if (!form.checkValidity()) {
                        event.preventDefault();
                        event.stopPropagation();
                    } else {
                        event.preventDefault();
                        // gather values
                        var opencode = document.getElementById('opencode').value.trim();
                        if (opencode === '') {
                            alert('Per favore, inserisci un codice prima di cercare.');
                            form.classList.add('was-validated');
                            return;
                        }
                        var addin = document.querySelector('input[name="AddinCmd"]:checked');
                        var addinVal = addin ? addin.value : '';
                        var clientID = document.getElementById('ClientID').value;
                        var locale = document.getElementById('locale').value;
                        var IISIDX = document.getElementById('IISIDX').value;
                        var contextID = document.getElementById('contextID').value;
                        var base = 'http://192.168.0.242/FUSION/plm.html';
                        var params = new URLSearchParams();
                        params.set('opencode', opencode);
                        if (addinVal) params.set('AddinCmd', addinVal);
                        if (clientID) params.set('ClientID', clientID);
                        if (locale) params.set('locale', locale);
                        if (IISIDX) params.set('IISIDX', IISIDX);
                        if (contextID) params.set('contextID', contextID);
                        // open result in a new tab (change to '_self' to reuse same tab)
                        window.open(base + (base.indexOf('?') === -1 ? '?' : '&') + params.toString(), '_blank');
                    }
                    form.classList.add('was-validated');
                }, false);
            });
        })();
    </script>
</body>

</html>
